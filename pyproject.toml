[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "errlens-cli"
version = "0.1.0"
description = "Local Python error explanations with opt-in terminal and shell integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ErrLens contributors"}]
dependencies = ["typer>=0.16,<1", "rich>=14,<15"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "mypy>=1.15,<2"]

[project.scripts]
errlens = "errlens.cli:main_entry"

[project.urls]
Homepage = "https://github.com/ErrLens/errlens-cli"
Source = "https://github.com/ErrLens/errlens-cli"
Documentation = "https://github.com/ErrLens/errlens-cli/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
errlens = ["locales/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/errlens"]
